version: 2
project_name: terraform-provider-hue
builds:
  - id: provider
    main: .
    env: [CGO_ENABLED=0]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{ .Version }}']
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}_v{{ .Version }}'
  - id: cli
    main: ./cmd/hue-tf
    env: [CGO_ENABLED=0]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{ .Version }}']
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    binary: hue-tf
archives:
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'hue-tf_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
# The Registry rejects a release that has a file this SHA256SUMS does not
# list, so it covers the hue-tf archives too.
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args: [--batch, --local-user, '{{ .Env.GPG_FINGERPRINT }}', --output, '${signature}', --detach-sign, '${artifact}']
release:
  draft: true
  # A rerun uploads to the same draft.
  use_existing_draft: true
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
